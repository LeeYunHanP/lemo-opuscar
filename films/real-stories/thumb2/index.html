<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'InterBlack';src:url('InterDisplay-Black.otf')}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#111}
.bg{position:absolute;overflow:hidden}
.bg img{position:absolute}
.t{position:absolute;font-family:'InterBlack';font-weight:900;line-height:.86;letter-spacing:-.02em;text-transform:uppercase}
.w{color:#fff;-webkit-text-stroke:14px #000;paint-order:stroke fill;text-shadow:0 10px 0 #000,0 14px 30px rgba(0,0,0,.6)}
.box{display:inline-block;padding:4px 26px 14px;transform:rotate(-2.5deg);box-shadow:0 10px 0 #000}
.rec{position:absolute;font-family:'InterBlack';font-size:44px;color:#fff;-webkit-text-stroke:8px #000;paint-order:stroke fill;letter-spacing:.02em}
.rec i{display:inline-block;width:34px;height:34px;border-radius:50%;background:#ff2020;border:5px solid #000;margin-right:14px;vertical-align:-3px}
.ring{position:absolute;border:13px solid #ff1d1d;border-radius:50%;box-shadow:0 0 0 5px #000,inset 0 0 0 5px #000}
</style></head><body>
<div id="A" hidden>
  <div class="bg" style="left:0;top:0;width:1280px;height:720px"><img src="sunset.jpg" style="left:-330px;top:-135px;width:1900px;filter:saturate(1.7) contrast(1.15) brightness(1.06)"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 62%)"></div>
  <div class="t w" style="left:44px;top:150px;font-size:178px">VICE<br>CITY</div>
  <div class="t" style="left:40px;top:470px;font-size:128px"><span class="box" style="background:#ff2d87;color:#fff">WAS REAL</span></div>
  <div class="rec" style="left:46px;top:44px"><i></i>TRUE STORIES</div>
</div>
<div id="B" hidden>
  <div style="position:absolute;inset:0;background:#0d0d10"></div>
  <div class="bg" style="left:0;top:0;width:1280px;height:720px"><img src="van.jpg" style="left:199px;top:-10px;width:1300px;filter:saturate(1.6) contrast(1.2) brightness(1.12)"></div>
  <div style="position:absolute;left:0;top:0;width:740px;height:720px;background:linear-gradient(90deg,#0d0d10 70%,rgba(13,13,16,0))"></div>
  <div style="position:absolute;left:500px;top:20px;width:130px;height:90px;background:radial-gradient(closest-side,#0d0d10 60%,rgba(13,13,16,0))"></div><div style="position:absolute;left:495px;top:615px;width:150px;height:90px;background:radial-gradient(closest-side,#0d0d10 60%,rgba(13,13,16,0))"></div>
  <div class="ring" style="left:695px;top:118px;width:568px;height:240px;transform:rotate(-4deg)"></div>
  <div class="t w" style="left:40px;top:120px;font-size:150px">VICE<br>CITY</div>
  <div class="t" style="left:34px;top:396px;font-size:112px"><span class="box" style="background:#ffd400;color:#000">WAS</span></div>
  <div class="t" style="left:34px;top:530px;font-size:112px"><span class="box" style="background:#ffd400;color:#000;transform:rotate(2deg)">REAL</span></div>
  <div class="rec" style="left:600px;top:600px;font-size:46px"><i></i>MIAMI, JULY 1979</div>
</div>
<script>
const v=(new URLSearchParams(location.search).get('v')||'A').toUpperCase(); document.getElementById(v).hidden=false;
window.DUR=1;window.render=()=>{};
Promise.all([document.fonts.load('900 100px InterBlack'),...[...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=r))]).then(()=>window.READY=true);
</script>
</body></html>
